<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1C21"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="100%" stop-color="#0071E3"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E2E8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0071E3" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fundo Apple Squircle com Borda de Luz -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8"/>

  <!-- Monograma Geométrico G Suíço -->
  <path d="M 334 168
           A 136 136 0 0 0 240 120
           A 136 136 0 1 0 376 256
           L 376 230
           L 246 230
           L 246 282
           L 324 282
           A 84 84 0 1 1 240 172
           A 84 84 0 0 1 298 196
           L 334 168 Z"
        fill="url(#textGrad)"/>

  <!-- Ponto Estratégico Apple Blue Luminoso -->
  <circle cx="368" cy="144" r="28" fill="url(#dotGrad)" filter="url(#glow)"/>
</svg>
